<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Agent Abshir</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#F8F6F2">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Abshir">
<style>
  /* Same look as the Mac app and abshirnoor.github.io. Your plans are encrypted in data.enc.json;
     this page only decrypts them in your browser with your password. */
  :root { --page: #F8F6F2; --bar: #E7E7E7; --text: #333; --title: #000; --rule: #333; --soft: #E7E7E7; --muted: #6f6f6f; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --page: #161616; --bar: #242424; --text: #ddd; --title: #fff; --rule: #ddd; --soft: #2a2a2a; --muted: #9a9a9a; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --page: #161616; --bar: #242424; --text: #ddd; --title: #fff; --rule: #ddd; --soft: #2a2a2a; --muted: #9a9a9a; color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--page); color: var(--text); font: 15px/1.5 Helvetica, "Helvetica Neue", Arial, sans-serif; }
  [hidden] { display: none !important; }
  a { color: inherit; }
  .bar { background: var(--bar); padding: calc(14px + env(safe-area-inset-top)) 16px 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 18px; }
  .brand { font-weight: 500; margin-right: auto; line-height: 1.25; }
  .brand span { display: block; font-weight: 400; font-size: 12px; }
  .tabs { display: flex; flex-wrap: wrap; gap: 6px 16px; }
  .tabs a, .tabs button { text-decoration: none; font: inherit; background: none; border: 0; padding: 0; color: var(--text); cursor: pointer; }
  .tabs a[aria-current="page"] { text-decoration: underline; text-underline-offset: 3px; font-weight: 500; }
  main { padding: 22px 16px calc(48px + env(safe-area-inset-bottom)); max-width: 900px; margin: 0 auto; }
  .title { font-size: clamp(44px, 13vw, 80px); font-weight: 700; letter-spacing: -0.5px; line-height: 1.05; color: var(--title); margin: 0 0 6px; }
  .subtitle { margin: 0 0 22px; color: var(--muted); }
  .facts { display: flex; flex-wrap: wrap; gap: 6px 26px; margin: 0 0 26px; }
  .facts dt { font-size: 12px; color: var(--muted); }
  .facts dd { margin: 0; font-variant-numeric: tabular-nums; }
  section.row { display: grid; grid-template-columns: 170px minmax(0, 1fr); gap: 20px; border-top: 1px solid var(--rule); padding: 14px 0 30px; }
  section.row > h2 { margin: 0; font-size: 16px; font-weight: 400; }
  .state { display: block; font-size: 12px; color: var(--muted); margin-top: 4px; }
  .focus { margin: 0; font-size: 18px; color: var(--title); }
  .muted { color: var(--muted); margin: 6px 0 0; }
  ol.items { list-style: none; margin: 0; padding: 0; }
  ol.items li { display: grid; grid-template-columns: 22px 52px minmax(0, 1fr); gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--soft); }
  ol.items.plain li { grid-template-columns: 22px minmax(0, 1fr); }
  .box { width: 16px; height: 16px; margin-top: 3px; border: 1px solid var(--rule); display: grid; place-items: center; font-size: 11px; line-height: 1; color: var(--page); }
  li.done .box { background: var(--title); }
  li.done .what { text-decoration: line-through; text-decoration-color: var(--muted); }
  .what { color: var(--title); }
  .note { color: var(--muted); font-size: 13px; }
  time { font-variant-numeric: tabular-nums; }
  section.locked ol { opacity: .45; }
  .monthnav { display: flex; gap: 18px; margin: -10px 0 22px; }
  .monthnav button { font: inherit; background: none; border: 0; padding: 0; color: var(--text); cursor: pointer; }
  .foot { font-size: 12px; color: var(--muted); margin-top: 28px; }
  /* Password screen */
  .lock { max-width: 420px; }
  .lock label { display: block; margin: 0 0 6px; }
  .lock .ask { font-size: 26px; font-weight: 400; color: var(--title); margin: 18vh 0 18px; }
  .lock input[type="password"] { width: 100%; font: inherit; font-size: 16px; color: var(--text); background: transparent; border: 0; border-bottom: 1px solid var(--rule); padding: 8px 2px; outline: none; }
  .lock .remember { display: flex; gap: 8px; align-items: center; margin: 14px 0 18px; color: var(--muted); }
  .lock button[type="submit"] { font: inherit; border: 0; background: var(--title); color: var(--page); padding: 10px 20px; cursor: pointer; }
  .lock .error { color: var(--title); font-weight: 500; min-height: 1.5em; }
  :focus-visible { outline: 2px solid var(--title); outline-offset: 2px; }
  @media (max-width: 640px) { section.row { grid-template-columns: minmax(0, 1fr); gap: 8px; padding: 12px 0 24px; } }
</style>
</head>
<body>
<header class="bar">
  <div class="brand">Agent Abshir<span>Planner</span></div>
  <nav class="tabs" id="tabs" hidden aria-label="Planners">
    <a href="#daily" data-view="daily">Daily Planner</a>
    <a href="#video" data-view="video">Video planner</a>
    <a href="https://t.me/abshernorbot" target="_blank" rel="noopener">Tick in Telegram</a>
    <button type="button" id="mode">Mode: Auto</button>
    <button type="button" id="lockBtn">Lock</button>
  </nav>
</header>

<main>
  <form class="lock" id="lock">
    <label for="pw" class="ask">oh babes, who is you?</label>
    <input type="password" id="pw" autocomplete="current-password" placeholder="your answer" required>
    <label class="remember"><input type="checkbox" id="remember"> remember me on this phone</label>
    <button type="submit" id="unlock">it's me</button>
    <p class="error" id="err" role="alert"></p>
  </form>

  <div id="dailyView" hidden>
    <h1 class="title" id="dDay">Today</h1>
    <p class="subtitle" id="dDate"></p>
    <dl class="facts"><div><dt>Wake up</dt><dd id="dWake">—</dd></div><div><dt>Lights out</dt><dd id="dSleep">—</dd></div></dl>
    <section class="row"><h2>Focus</h2><div><p class="focus" id="dFocus">No plan for today yet.</p><p class="muted" id="dWeather"></p></div></section>
    <section class="row"><h2>Schedule</h2><ol class="items" id="dBlocks"></ol></section>
    <section class="row" id="dTasksRow" hidden><h2>This week<span class="state">Once, any day</span></h2><ol class="items plain" id="dTasks"></ol></section>
  </div>

  <div id="videoView" hidden>
    <h1 class="title" id="vMonth">Video planner</h1>
    <p class="subtitle" id="vTitle"></p>
    <div class="monthnav"><button id="vPrev" type="button" hidden></button><button id="vNext" type="button" hidden></button></div>
    <div id="vSections"></div>
    <section class="row"><h2>Progress</h2><p class="muted" id="vProgress"></p></section>
  </div>

  <p class="foot" id="foot" hidden></p>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const store = { get: (k) => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} } };
  const monthLabel = (m) => state?.videos?.[m]?.label ?? new Date(`${m.slice(0, 7)}-15T12:00`).toLocaleDateString(undefined, { month: "long" });
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  let state = null;
  let month = null;

  // Light / dark: Auto → Light → Dark, remembered on this device.
  const MODES = ["auto", "light", "dark"];
  let mode = store.get("mode") || "auto";
  function applyMode() {
    if (mode === "auto") delete document.documentElement.dataset.theme; else document.documentElement.dataset.theme = mode;
    $("mode").textContent = `Mode: ${mode[0].toUpperCase()}${mode.slice(1)}`;
  }
  $("mode").onclick = () => { mode = MODES[(MODES.indexOf(mode) + 1) % 3]; store.set("mode", mode); applyMode(); };
  applyMode();

  async function decrypt(password) {
    const res = await fetch(`data.enc.json?t=${Date.now()}`, { cache: "no-store" });
    if (!res.ok) throw new Error("Couldn't load your plans. Check your connection and try again.");
    const enc = await res.json();
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
    const key = await crypto.subtle.deriveKey({ name: "PBKDF2", hash: "SHA-256", salt: unb64(enc.salt), iterations: enc.iterations }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    try {
      const plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: unb64(enc.iv) }, key, unb64(enc.data));
      return JSON.parse(new TextDecoder().decode(plain));
    } catch {
      throw new Error("hmm, that's not you. try again.");
    }
  }

  function renderDaily() {
    const t = state.today;
    const d = new Date(`${t.date}T12:00`);
    $("dDay").textContent = d.toLocaleDateString(undefined, { weekday: "long" });
    $("dDate").textContent = `${d.toLocaleDateString(undefined, { day: "numeric", month: "long", year: "numeric" })}${t.greeting ? ` · ${t.greeting}` : ""}`;
    $("dWake").textContent = t.wake_time ?? "—";
    $("dSleep").textContent = t.sleep_time ?? "—";
    $("dFocus").textContent = t.focus ?? "No plan for today yet.";
    $("dWeather").textContent = t.weather ?? "";
    $("dBlocks").innerHTML = (t.blocks ?? []).map((b) => `
      <li class="${b.done ? "done" : ""}"><span class="box" aria-label="${b.done ? "done" : "not done"}">${b.done ? "✓" : ""}</span><time>${esc(b.start)}</time>
        <div><div class="what">${esc(b.title)}</div>${b.end || b.note ? `<div class="note">${b.end ? `until ${esc(b.end)}` : ""}${b.end && b.note ? " · " : ""}${esc(b.note)}</div>` : ""}</div></li>`).join("");
    $("dTasksRow").hidden = !t.tasks?.length;
    $("dTasks").innerHTML = (t.tasks ?? []).map((k) => `
      <li class="${k.done ? "done" : ""}"><span class="box">${k.done ? "✓" : ""}</span>
        <div><div class="what">${esc(k.title)}</div>${k.note ? `<div class="note">${esc(k.note)}</div>` : ""}</div></li>`).join("");
  }

  function renderVideo() {
    const months = Object.keys(state.videos ?? {}).sort();
    if (!months.length) { $("vSections").innerHTML = '<p class="muted">No video planners yet.</p>'; return; }
    if (!month) month = months.includes(state.this_month) ? state.this_month : months.at(-1);
    const v = state.videos[month];
    const i = months.indexOf(month), prev = months[i - 1], next = months[i + 1];
    $("vMonth").textContent = monthLabel(month);
    $("vTitle").textContent = `${v.title}${v.style ? ` · ${v.style}` : ""}`;
    $("vPrev").hidden = !prev; $("vPrev").textContent = prev ? `‹ ${monthLabel(prev)}` : ""; $("vPrev").onclick = () => { month = prev; renderVideo(); };
    $("vNext").hidden = !next; $("vNext").textContent = next ? `${monthLabel(next)} ›` : ""; $("vNext").onclick = () => { month = next; renderVideo(); };
    $("vSections").innerHTML = v.sections.map((sec) => {
      const note = sec.state === "locked" ? `Opens when the part above is done${sec.starts ? ` or on ${esc(sec.starts)}` : ""}.` : sec.state === "done" ? "Done." : "";
      return `<section class="row ${sec.state}"><h2>${esc(sec.title)}${note ? `<span class="state">${note}</span>` : ""}</h2><ol class="items plain">${sec.tasks.map((t) => `
        <li class="${t.done ? "done" : ""}"><span class="box">${t.done ? "✓" : ""}</span>
          <div><div class="what">${esc(t.title)}</div>${t.film ? `<div class="note">Film: ${esc(t.film)}</div>` : ""}</div></li>`).join("")}</ol></section>`;
    }).join("");
    $("vProgress").textContent = `${v.done} of ${v.total} scenes filmed. Tick them in Telegram (🎯 Video planner).`;
  }

  function showView() {
    if (!state) return;
    const view = location.hash === "#video" ? "video" : "daily";
    $("dailyView").hidden = view !== "daily";
    $("videoView").hidden = view !== "video";
    document.querySelectorAll(".tabs a[data-view]").forEach((a) => (a.dataset.view === view ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current")));
  }
  addEventListener("hashchange", showView);

  function open(data) {
    state = data;
    $("lock").hidden = true;
    $("tabs").hidden = false;
    renderDaily();
    renderVideo();
    $("foot").hidden = false;
    $("foot").textContent = `Updated from your Mac: ${new Date(state.updated_at).toLocaleString(undefined, { weekday: "short", hour: "2-digit", minute: "2-digit" })}. View only; tick things in Telegram.`;
    showView();
  }

  $("lock").addEventListener("submit", async (e) => {
    e.preventDefault();
    $("err").textContent = "";
    $("unlock").disabled = true;
    $("unlock").textContent = "checking…";
    try {
      const pw = $("pw").value;
      open(await decrypt(pw));
      store.set("pw", $("remember").checked ? pw : null);
      $("pw").value = "";
    } catch (err) {
      $("err").textContent = err.message;
    } finally {
      $("unlock").disabled = false;
      $("unlock").textContent = "it's me";
    }
  });
  $("lockBtn").onclick = () => { store.set("pw", null); location.reload(); };

  const saved = store.get("pw");
  if (saved) decrypt(saved).then(open).catch(() => store.set("pw", null));
</script>
</body>
</html>
